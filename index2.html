<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bubble Sort</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* PÁGINA PRINCIPAL */

        .container {
            width: 90%;
            max-width: 850px;

            background: #151515;

            padding: 40px;

            border-radius: 20px;

            border: 2px solid #ff4fa3;

            box-shadow:
                0 0 30px rgba(255, 79, 163, 0.25);

            text-align: center;
        }

        h1 {
            color: #ff4fa3;

            font-size: 42px;

            margin-bottom: 10px;

            text-shadow:
                0 0 15px rgba(255, 79, 163, 0.7);
        }

        .descricao {
            color: #aaa;
            margin-bottom: 30px;
        }

        /* INPUT */

        input {
            width: 100%;

            padding: 15px;

            background: #222;

            color: white;

            border: 1px solid #ff4fa3;

            border-radius: 10px;

            outline: none;

            font-size: 16px;

            margin-bottom: 15px;
        }

        input:focus {
            border-color: #ff75b8;

            box-shadow:
                0 0 15px rgba(255, 79, 163, 0.5);
        }

        /* BOTÃO */

        .ordenar {
            background: #ff4fa3;

            color: white;

            border: none;

            border-radius: 10px;

            padding: 14px 30px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .ordenar:hover {
            background: #ff75b8;

            transform: scale(1.05);

            box-shadow:
                0 0 20px rgba(255, 79, 163, 0.6);
        }

        /* RESULTADO */

        .resultado {
            margin-top: 35px;

            padding: 25px;

            background: #0d0d0d;

            border-radius: 15px;

            border: 1px solid #333;
        }

        .resultado h2 {
            color: #ff4fa3;

            margin-bottom: 25px;

            text-shadow:
                0 0 10px rgba(255, 79, 163, 0.4);
        }

        /* BOLHAS */

        .numeros {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            flex-wrap: wrap;

            min-height: 80px;
        }

        .numero {
            width: 65px;
            height: 65px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 50%;

            color: white;

            font-weight: bold;

            font-size: 18px;

            transition: 0.3s;

            box-shadow:
                0 0 15px rgba(255, 255, 255, 0.15);

            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .numero:hover {
            transform: translateY(-8px) scale(1.08);

            box-shadow:
                0 0 25px currentColor;
        }

        /* CORES DAS BOLHAS */

        .numero:nth-child(8n + 1) {
            background: #ff4fa3;
            color: #ff4fa3;
        }

        .numero:nth-child(8n + 2) {
            background: #a855f7;
            color: #a855f7;
        }

        .numero:nth-child(8n + 3) {
            background: #3b82f6;
            color: #3b82f6;
        }

        .numero:nth-child(8n + 4) {
            background: #22c55e;
            color: #22c55e;
        }

        .numero:nth-child(8n + 5) {
            background: #f59e0b;
            color: #f59e0b;
        }

        .numero:nth-child(8n + 6) {
            background: #ef4444;
            color: #ef4444;
        }

        .numero:nth-child(8n + 7) {
            background: #ec4899;
            color: #ec4899;
        }

        .numero:nth-child(8n + 8) {
            background: #8b5cf6;
            color: #8b5cf6;
        }

        /* EXPLICAÇÃO */

        .explicacao {
            margin-top: 30px;

            text-align: left;

            background: #111;

            padding: 20px;

            border-left: 4px solid #ff4fa3;

            border-radius: 8px;

            box-shadow:
                0 0 15px rgba(255, 79, 163, 0.08);
        }

        .explicacao h3 {
            color: #ff4fa3;

            margin-bottom: 10px;
        }

        .explicacao p {
            color: #bbb;

            line-height: 1.6;
        }

        /* CELULAR */

        @media (max-width: 600px) {

            body {
                padding: 20px 0;
            }

            .container {
                padding: 25px;
            }

            h1 {
                font-size: 32px;
            }

            .numero {
                width: 55px;
                height: 55px;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Bubble Sort</h1>

        <p class="descricao">
            Digite os números e veja o algoritmo organizá-los.
        </p>

        <input
            type="text"
            id="entrada"
            placeholder="Ex: 5, 3, 8, 1, 2, 7"
        >

        <button
            class="ordenar"
            onclick="ordenarNumeros()">

            Ordenar números

        </button>

        <div class="resultado">

            <h2>Resultado</h2>

            <div
                id="numeros"
                class="numeros">
            </div>

        </div>

        <div class="explicacao">

            <h3>Como funciona?</h3>

            <p>
                O Bubble Sort compara dois números que estão
                lado a lado. Se o primeiro for maior que o segundo,
                eles trocam de lugar. O processo continua até que
                todos os números estejam organizados.
            </p>

        </div>

    </div>

    <script>

        function ordenarNumeros() {

            let entrada =
                document.getElementById("entrada").value;

            let numeros =
                entrada.split(",").map(Number);

            if (
                entrada.trim() === "" ||
                numeros.some(isNaN)
            ) {

                alert(
                    "Digite apenas números separados por vírgula!"
                );

                return;
            }

            /* BUBBLE SORT */

            for (
                let i = 0;
                i < numeros.length - 1;
                i++
            ) {

                for (
                    let j = 0;
                    j < numeros.length - 1 - i;
                    j++
                ) {

                    if (
                        numeros[j] >
                        numeros[j + 1]
                    ) {

                        let auxiliar =
                            numeros[j];

                        numeros[j] =
                            numeros[j + 1];

                        numeros[j + 1] =
                            auxiliar;

                    }

                }

            }

            /* MOSTRAR RESULTADO */

            let resultado =
                document.getElementById("numeros");

            resultado.innerHTML = "";

            numeros.forEach(function(numero) {

                let elemento =
                    document.createElement("div");

                elemento.classList.add("numero");

                elemento.textContent = numero;

                resultado.appendChild(elemento);

            });

        }

    </script>

</body>

</html>
